name: Build and Push Docker Images

# Every run on main publishes the chart as the next MAJOR.MINOR.PATCH and tags
# the commit v<version> (hack/release/next-chart-version.sh reads those tags).
on:
  push:
    branches: [main]

  # A manual minor/major release, or a patch re-run of a build a push failed
  # to trigger (e.g. an Actions outage).
  workflow_dispatch:
    inputs:
      release_type:
        description: "patch (as every main merge), or a manual minor/major bump"
        type: choice
        options: [patch, minor, major]
        default: patch

# A running release is never cancelled: cancelled between its tag and its chart
# push, it would leave a version whose chart never shipped. GitHub keeps one run
# waiting and a newer one replaces it; a replaced merge still ships in the next
# release, but a replaced minor/major dispatch must be run again.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# ArgoCD deploys every chart this publishes (apps/direwolf.yaml follows `0.*`),
# so this repo holds no deploy credential: the cluster pulls. What guards it is
# who can run this (write access: push to main or a dispatch; never a fork PR)
# and the token below, granted per job and to nothing else.
permissions: {}

env:
  # build-push-action uploads a .dockerbuild build-record artifact per build, and it
  # counts against the org's shared Actions storage quota (XERK-1796).
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  # Only main's current tip is released. A branch dispatch would publish an
  # unreviewed build, and a run main has moved past (a re-run, or a merge that
  # waited behind another release) is shipped by the newer run instead.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.tip.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check this is main's tip
        id: tip
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::Releases run on main only, not $REF"
            exit 1
          fi
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at $tip, past $GITHUB_SHA; its own run releases it"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # A red main publishes nothing, so deploys nothing.
  tests:
    needs: plan
    if: ${{ needs.plan.outputs.release == 'true' }}
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build_and_push_containers:
    runs-on: ubuntu-latest
    needs: [plan, tests]
    if: ${{ needs.plan.outputs.release == 'true' }}
    permissions:
      contents: read
      packages: write
    strategy:
      # A failed library build must not cancel the Go images the chart needs.
      fail-fast: false
      matrix:
        app:
          - moonlight-proxy
          - operator
          - nri-input
        # Non-Go images: own build context under images/, own Dockerfile.
        include:
          - app: library
            context: images/library
          - app: retroarch
            context: images/retroarch
          # GOW Steam/Heroic plus NVIDIA's 32-bit driver libraries (XERK-1930).
          - app: steam
            context: images/gow-nvidia32
            target: steam
          - app: heroic
            context: images/gow-nvidia32
            target: heroic
          # Go binary plus a C shim: repo-root context, own Dockerfile.
          - app: nri-nvenc-fix
            file: cmd/nri-nvenc-fix/Dockerfile
          - app: wolf-agent
            file: cmd/wolf-agent/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        if: ${{ !github.event.pull_request.head.repo.fork }}
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate docker image tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          flavor: |
            # Disable latest tag
            latest=false
          images: |
            name=ghcr.io/${{ github.repository_owner }}/fenrir/${{ matrix.app == 'operator' && 'direwolf-operator' || matrix.app }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context || '{{defaultContext}}' }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ !github.event.pull_request.head.repo.fork }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            APP_NAME=${{ matrix.app }}
          
      - name: Write image digest file
        if: ${{ steps.build.outputs.digest }}
        run: |
          echo "${{ steps.build.outputs.digest }}" > "image-digest-${{ matrix.app }}.txt"

      - name: Upload image digest artifact
        if: ${{ steps.build.outputs.digest }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.app }}
          path: image-digest-${{ matrix.app }}.txt
          retention-days: 3

  build_and_push_chart:
    runs-on: ubuntu-latest
    needs: [plan, tests, build_and_push_containers]
    # Runs even if a matrix leg failed: the chart only needs the Go image
    # digests, and a missing one fails its download step below. Never past
    # failed tests.
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' && needs.tests.result == 'success' }}
    permissions:
      contents: write # the v<version> release tag
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # next-chart-version.sh counts from the v* tags.
          fetch-tags: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.12.0'

      - name: Get chart version
        id: get_version
        # Inputs and refs reach the script as environment variables, never as
        # ${{ }} splices.
        env:
          RELEASE_TYPE: ${{ inputs.release_type || 'patch' }}
        run: |
          set -euo pipefail
          # Given the commit, the script refuses one older than the latest
          # release, should main's tip have been a re-run (see plan).
          VERSION="$(hack/release/next-chart-version.sh "$RELEASE_TYPE" "$GITHUB_SHA")"
          echo "Chart version: $VERSION ($RELEASE_TYPE)"
          yq e -i ".version = \"$VERSION\" | .appVersion = \"$VERSION\"" charts/direwolf-operator/Chart.yaml
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Copy CRDs into chart
        run: |
          # Ensure the chart CRDs directory exists and copy repository CRDs there. This makes them part of the packaged chart.
          mkdir -p charts/direwolf-operator/crds
          if compgen -G "crds/*.yaml" > /dev/null; then
            cp crds/*.yaml charts/direwolf-operator/crds/
          else
            echo "No CRDs found in repository crds/ - continuing"
          fi

      - name: Download image digest artifact (operator)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-digest-operator
          path: operator-artifact

      - name: Download image digest artifact (moonlight-proxy)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-digest-moonlight-proxy
          path: proxy-artifact

      - name: Download image digest artifact (wolf-agent)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-digest-wolf-agent
          path: agent-artifact

      # The library leg may fail without failing the chart (fail-fast: false).
      - name: Download image digest artifact (library)
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-digest-library
          path: library-artifact

      - name: Update Helm chart image tags
        uses: mikefarah/yq@1b9b4ac5187171d2e5e3129be0cfa827c7f9d53d # v4.53.3
        env:
          REF_NAME: ${{ github.ref_name }}
        with:
          cmd: |   
            VALUES_FILE=charts/direwolf-operator/values.yaml
            
            OP_DIGEST="$(cat operator-artifact/image-digest-operator.txt)"
            yq e -i ".controllers.direwolf_operator.containers.operator.image.repository = \\"ghcr.io/${{ github.repository_owner }}/fenrir/direwolf-operator\\"" "$VALUES_FILE"
            yq e -i ".controllers.direwolf_operator.containers.operator.image.tag = \\"${REF_NAME}@${OP_DIGEST}\\"" "$VALUES_FILE"
            
            AG_DIGEST="$(cat agent-artifact/image-digest-wolf-agent.txt)"
            yq e -i ".controllers.direwolf_operator.containers.operator.env.AGENT_IMAGE = \\"ghcr.io/${{ github.repository_owner }}/fenrir/wolf-agent:${REF_NAME}@${AG_DIGEST}\\"" "$VALUES_FILE"

            PX_DIGEST="$(cat proxy-artifact/image-digest-moonlight-proxy.txt)"
            yq e -i ".controllers.moonlight_proxy.containers.proxy.image.tag = \\"${REF_NAME}@${PX_DIGEST}\\"" "$VALUES_FILE"
            yq e -i ".controllers.moonlight_proxy.containers.proxy.image.repository = \\"ghcr.io/${{ github.repository_owner }}/fenrir/moonlight-proxy\\"" "$VALUES_FILE"

            LIBRARY_IMAGE="ghcr.io/${{ github.repository_owner }}/fenrir/library:${REF_NAME}"
            if [ -s library-artifact/image-digest-library.txt ]; then
              LIBRARY_IMAGE="${LIBRARY_IMAGE}@$(cat library-artifact/image-digest-library.txt)"
            fi
            yq e -i ".controllers.direwolf_operator.containers.operator.env.LIBRARY_IMAGE = \\"${LIBRARY_IMAGE}\\"" "$VALUES_FILE"
            
            echo "Updated $VALUES_FILE"

      - name: Package Helm chart
        run: |
          mkdir -p packaged
          helm dependency update charts/direwolf-operator
          helm package charts/direwolf-operator -d packaged
          ls -lah packaged

      - name: Login to GHCR for Helm OCI
        if: ${{ !github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail
          echo "Logging in to ghcr.io with helm registry login"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      # Tagged before the push, so a version is never published twice: if the
      # push then fails, the next run skips this version rather than reusing it.
      # A re-run then refuses (already tagged); ship the commit with the next
      # merge or a minor dispatch.
      - name: Tag the release
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"

      - name: Push packaged chart with Helm (OCI)
        env:
          CHART_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          chart_file=$(ls packaged/*.tgz | head -n1)
          if [ -z "$chart_file" ]; then
            echo "No packaged chart found" >&2
            exit 1
          fi
          chart_ref="oci://ghcr.io/${{ github.repository_owner }}/charts"
          echo "Pushing $chart_file to $chart_ref"
          helm push "$chart_file" "$chart_ref"

      - name: Verify pushed artifact
        run: |
          chart_ref="oci://ghcr.io/${{ github.repository_owner }}/charts:${{ steps.get_version.outputs.version }}"
          echo "Pushed chart $chart_ref"

