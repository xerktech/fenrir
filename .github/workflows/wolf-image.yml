name: Wolf Image

on:
  pull_request:
    branches: [main]
    paths:
      # The pinned WOLF_IMAGE, and wolfCommand / wolfBinary that start it.
      - 'charts/direwolf-operator/values.yaml'
      - 'pkg/controllers/session.go'
      - 'pkg/controllers/wolf_image_test.go'
      - '.github/workflows/wolf-image.yml'

permissions:
  contents: read

jobs:
  wolf-image:
    name: Pinned Wolf image starts under wolfCommand
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Run the check
        env:
          WOLF_IMAGE_CHECK: "1"
        run: go test -count=1 -run '^TestPinnedWolfImageStartsUnderWolfCommand$' -v ./pkg/controllers/
