name: Run Test

on:
  pull_request:
    branches: [main]
  # builder.yml reruns it on the commit it releases: main auto-deploys, and a
  # PR is tested against the main it branched from, not the one it lands on.
  workflow_call:

permissions:
  contents: read

jobs:
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-file: go.mod
          go-package: ./...

  test:
    name: go test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -shuffle=on -timeout 5m ./...

  # nri-input's adjustments replayed through containerd 2.2.6's NRI (v0.11.0),
  # pinned in its own module: a field that version mishandles panics the
  # node's containerd (XERK-1915).
  nri-containerd:
    name: nri-input on containerd 2.2.6's NRI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: cmd/nri-input/containerd226/go.mod
          cache-dependency-path: cmd/nri-input/containerd226/go.sum

      - name: Run tests
        working-directory: cmd/nri-input/containerd226
        run: go vet ./... && go test -race ./...
