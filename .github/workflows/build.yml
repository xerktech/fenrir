name: Verify Docker Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # build-push-action uploads a .dockerbuild build-record artifact per build, and it
  # counts against the org's shared Actions storage quota (XERK-1796).
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  verify_build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - wolf-agent
          - moonlight-proxy
          - operator
          - nri-input
        # Non-Go images: own build context under images/, own Dockerfile.
        include:
          - app: library
            context: images/library
          - app: retroarch
            context: images/retroarch
          # fclones for the game-library dedupe CronJob (XERK-2500).
          - app: dedupe
            context: images/dedupe
          # GOW Steam/Heroic plus NVIDIA's 32-bit driver libraries (XERK-1930).
          - app: steam
            context: images/gow-nvidia32
            target: steam
          - app: heroic
            context: images/gow-nvidia32
            target: heroic
          # Heroic's session image plus Xodus Nexus (Microsoft Store games).
          - app: nexus
            context: images/gow-nvidia32
            target: nexus
          # The nexus image plus Ferestre, on trial as its alternative (XERK-2471).
          - app: ferestre
            context: images/gow-nvidia32
            target: ferestre
          # Heroic's session image plus Proton-CachyOS for one Battle.net game.
          - app: battlenet
            context: images/gow-nvidia32
            target: battlenet
          # Go binary plus a C shim: repo-root context, own Dockerfile.
          - app: nri-nvenc-fix
            file: cmd/nri-nvenc-fix/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build image (no push)
        uses: docker/build-push-action@v6.15.0
        with:
          context: ${{ matrix.context || '{{defaultContext}}' }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          tags: ghcr.io/${{ github.repository_owner }}/fenrir/${{ matrix.app == 'operator' && 'direwolf-operator' || matrix.app }}
          build-args: |
            APP_NAME=${{ matrix.app }}

  # Packages the chart exactly as builder.yml does on main (CRDs copied in,
  # dependencies fetched), without pushing, so a broken chart fails the PR
  # instead of the first build after merge.
  verify_chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.12.0'

      - name: Copy CRDs into chart
        run: |
          mkdir -p charts/direwolf-operator/crds
          cp crds/*.yaml charts/direwolf-operator/crds/

      - name: Fetch chart dependencies
        run: helm dependency update charts/direwolf-operator

      - name: Lint chart
        run: helm lint --strict charts/direwolf-operator

      # helm template defaults to a Kubernetes version below the chart's
      # kubeVersion floor (>=1.28), so it has to be stated. Provisioning set,
      # so its wiring is checked (charts/provisioning_test.go).
      - name: Render chart
        run: >-
          helm template direwolf charts/direwolf-operator --include-crds --kube-version 1.36.0
          --set provisioning.group=k8x-games
          --set provisioning.home.storageClassName=local-path
          --set provisioning.games.storageClassName=local-path
          --set-json 'provisioning.userTemplate={"resources":{"limits":{"cpu":"8"}}}'
          > "$RUNNER_TEMP/chart.yaml"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # Checks on what the chart renders, e.g. moonlight-proxy's RBAC scope.
      # They skip without the manifest, so they only really run here.
      - name: Test rendered chart
        run: DIREWOLF_CHART_MANIFEST="$RUNNER_TEMP/chart.yaml" DIREWOLF_CHART_PROVISIONING=1 go test -count=1 ./charts/

      - name: Package chart
        run: helm package charts/direwolf-operator -d packaged
