name: Nexus XGameRuntime patch builds

# Builds images/library's patched xgameruntime.dll for each new upstream Nexus
# runtime (domsvoboda/nexus-runtime) and publishes it as a release here, named
# nexus-xgameruntime-<runtime tag>-<patch id>. The Library installs the one
# matching its runtime and patch series for the games listed beside the patches
# (xodus-nexus-game-patches); without one it keeps upstream's DLL.
#
# A run that fails because the patches no longer apply (build.sh exit 3) means
# upstream changed that code: check whether it fixed the games, then drop or
# rebase the patch. Release tags never start with v, so the chart's version
# tags (hack/release/next-chart-version.sh) are untouched.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - images/library/root/usr/share/xodus-nexus/xgameruntime/**
      - hack/nexus-xgameruntime/**
      - .github/workflows/nexus-xgameruntime.yml
  pull_request:
    branches: [main]
    paths:
      - images/library/root/usr/share/xodus-nexus/xgameruntime/**
      - hack/nexus-xgameruntime/**
      - .github/workflows/nexus-xgameruntime.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          pid="$(hack/nexus-xgameruntime/patch-id.sh images/library/root/usr/share/xodus-nexus/xgameruntime/patches)"
          # The newest two published x86_64 runtimes: the Library installs the
          # newest, and a pod may still run the one it replaced.
          mapfile -t runtimes < <(gh api 'repos/domsvoboda/nexus-runtime/releases?per_page=30' --jq '
            [.[] | select((.draft or .prerelease) | not)
                 | select(any(.assets[]; .name | test("^nexus-runtime-[A-Za-z0-9._-]+-x86_64\\.tar\\.xz$")))]
            | sort_by(.published_at) | reverse | .[0:2] | .[].tag_name')
          tags=()
          for t in "${runtimes[@]}"; do
            [[ "$t" =~ ^[A-Za-z0-9._-]+$ ]] || continue
            if [[ "$EVENT" == pull_request ]]; then
              # A PR proves the patches still build against the newest runtime.
              tags+=("$t"); break
            fi
            gh release view "nexus-xgameruntime-$t-$pid" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || tags+=("$t")
          done
          printf 'patch id %s; to build: %s\n' "$pid" "${tags[*]:-none}"
          echo "tags=$(printf '%s\n' "${tags[@]}" | jq -R . | jq -cs 'map(select(length > 0))')" >>"$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.tags != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.plan.outputs.tags) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install MinGW, CMake and widl
        run: |
          sudo apt-get -o Acquire::Retries=3 update -q
          # wine64-tools: widl, which the CMake build needs (as upstream's CI).
          sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends cmake make \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 wine64-tools
          # As nexus-runtime and upstream's CI: the posix thread model.
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
      - name: Build
        env:
          TAG: ${{ matrix.tag }}
        run: hack/nexus-xgameruntime/build.sh "$TAG" out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xgameruntime-${{ matrix.tag }}
          path: out/
          retention-days: 1

  publish:
    needs: [plan, build]
    # Only main publishes: the Library trusts these releases. Each runtime that
    # built publishes even when another's build failed (patches that no longer
    # apply to one runtime must not hold back the others); the failed build
    # still fails the run.
    if: ${{ !cancelled() && needs.plan.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.plan.outputs.tags != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.plan.outputs.tags) }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: artifact
        # No artifact: this runtime's build failed; nothing to publish for it.
        continue-on-error: true
        with:
          name: xgameruntime-${{ matrix.tag }}
          path: out
      - name: Publish
        if: steps.artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          pid="$(jq -r .patchId out/build.json)"
          release="nexus-xgameruntime-$TAG-$pid"
          (cd out && sha256sum -c xgameruntime.dll.sha256)
          gh release create "$release" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "$release" \
            --notes "Patched x86_64 xgameruntime.dll for domsvoboda/nexus-runtime $TAG (patch series $pid, from images/library/root/usr/share/xodus-nexus/xgameruntime/patches at $GITHUB_SHA). Installed by the Library for the games in that directory's games file. LGPL-2.1: source is upstream nexus-xgameruntime at the commit in build.json plus those patches." \
            out/xgameruntime.dll out/xgameruntime.dll.sha256 out/build.json
