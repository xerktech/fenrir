# Nexus and Battle.net game sessions: the game is the only tiled window, so it fills the
# output once nothing else takes space (XERK-2290). The Dockerfile drops GoW's
# waybar line; this drops the gaps and borders. A game window the size of the
# screen maps floating; with no border, a borderless one covers the output (a
# window with a Windows caption sits at its client area, a few px in). Included at the end of
# /cfg/sway/config, so it overrides GoW's values. Wine's popups (message boxes,
# splash screens) float on top and leave the game as it was.
#
# Not a fullscreen rule: GoW's for_window [class="steam"] (an unanchored regex)
# also matches Proton's steam_proton, a fullscreened ownerless Wine message box
# hides the game and leaves it tiled when it closes, and Wine undoes a
# compositor-imposed fullscreen on a windowed game.
default_border none
default_floating_border none
gaps inner 0
gaps outer 0
gaps top 0
gaps bottom 0
