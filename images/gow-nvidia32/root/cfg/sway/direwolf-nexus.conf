# Nexus games run under Proton, whose windows carry the X11 class
# steam_proton; a tiled game sat under waybar (XERK-2290). Fullscreen hides it.
# Included at the end of /cfg/sway/config: GoW's own
# `for_window [class="steam"] fullscreen disabled` comes after config.d and,
# criteria being unanchored regexes, matches steam_proton too. The last
# matching rule wins.
# Normal windows only: a fullscreened Wine dialog or splash hides the game,
# which then comes back tiled when it closes.
for_window [class="^steam_proton$" window_type="normal"] fullscreen enable
