# Session pods are hostNetwork, so the NetworkManager GoW's cont-init starts
# runs in the node's network namespace. Apps no longer add NET_ADMIN
# (XERK-2100); this config stays for any App that does.
# Out of the box it creates a "Wired connection" for every new address-less
# link (each pod veth) and runs DHCP on it, brings spare NICs up and
# rewrites their IPv6 settings (measured on talos04). Here it creates no
# profiles and manages only loopback and bridges, which it merely assumes
# while they carry the node's addresses ("connected (externally)"): Steam
# still sees a network, and no link changes (XERK-1867).
[main]
no-auto-default=*

[keyfile]
unmanaged-devices=*,except:type:loopback,except:type:bridge
