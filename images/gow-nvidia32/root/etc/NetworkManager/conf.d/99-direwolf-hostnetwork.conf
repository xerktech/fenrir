# Session pods are hostNetwork and the Steam App adds NET_ADMIN, so the
# NetworkManager GoW's cont-init starts runs in the node's network namespace.
# Out of the box it creates a "Wired connection" for every new address-less
# link (each pod veth) and runs DHCP on it, and strips addresses from links it
# manages (measured on talos04). Keep it observing only: no default profiles,
# no pod veths. The node's own links stay "connected (externally)", so Steam
# still sees a network.
[main]
no-auto-default=*

[keyfile]
unmanaged-devices=interface-name:veth*
