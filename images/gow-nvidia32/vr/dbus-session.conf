<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The vr session's own session bus (startup-app.sh). The stock session.conf
     listens on unix:tmpdir, which may be an abstract socket, and those live in
     the network namespace, not the filesystem. unix:dir= is always a file, here
     in this container's own /tmp. -->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:dir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <standard_session_servicedirs/>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
