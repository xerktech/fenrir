<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The vr session's session bus when the operator mounts the bus directory
     (startup-app.sh; always in native VR mode, XERK-2668). As
     dbus-session.conf, but on a fixed file in the directory the operator
     shares with the pod's vr-agent, which reads WiVRn's state from it.
     EXTERNAL auth admits only this uid. -->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:path=/run/direwolf-vr-bus/bus</listen>
  <auth>EXTERNAL</auth>
  <standard_session_servicedirs/>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
