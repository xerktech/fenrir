# XERK-2659 VR spike: hand-written WiVRn test pod on talos04 (not via the operator).
# kubectl apply -f pod.yaml; then drive it with kubectl exec (see README.md).
# Port 20034 is the last port of the operator's --session-port-range (20000-20034),
# which the port allocator (lowest free block first) hands out only to a 5th
# concurrent Session; check `kubectl get sessions -A -o yaml | grep -A8 ports:` first.
apiVersion: v1
kind: Namespace
metadata:
  name: vr-spike
  labels:
    # As the games namespace: PSA baseline refuses hostNetwork, and ghcr-pull
    # gets the namespace a ghcr pull secret.
    pod-security.kubernetes.io/enforce: privileged
    xerktech.com/ghcr-pull: "true"
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: vr-spike-gpu
  namespace: vr-spike
spec:
  # As gpu_claim.go builds it for the steam App (gpu.memory 8Gi).
  devices:
    requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.nvidia.com
          capacity:
            requests:
              memory: 8Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wivrn-config
  namespace: vr-spike
data:
  config.json: |
    {
      "port": 20034,
      "publish-service": "none",
      "encoder": "nvenc"
    }
---
# As games/nvidia-icd, which session Apps mount: the GPU claim's CDI spec injects
# the NVIDIA libraries but no ICD manifests, so without these Vulkan (WiVRn's
# compositor) runs on lavapipe and NVENC's CUDA import of its frames fails 999.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-icd
  namespace: vr-spike
data:
  10_nvidia.json: '{"file_format_version": "1.0.0", "ICD": {"library_path": "libEGL_nvidia.so.0"}}'
  nvidia_icd.json: '{"file_format_version": "1.0.1", "ICD": {"library_path": "libGLX_nvidia.so.0", "api_version": "1.4.329"}}'
---
apiVersion: v1
kind: Pod
metadata:
  name: wivrn
  namespace: vr-spike
spec:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: talos04.xerktech.com
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: present
      effect: NoSchedule
  resourceClaims:
    - name: gpu
      resourceClaimName: vr-spike-gpu
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
    - name: wivrn
      image: ghcr.io/xerktech/fenrir/vr-spike:xerk-2659@sha256:a669e5eb568c9608c1a13451d45c035b8d05cf51214b3b5bb9a822edf88844eb
      # The GoW entrypoint (sway, cont-init as root) is not needed: WiVRn's
      # compositor and hello_xr render offscreen through Vulkan.
      # WiVRn writes paired headsets' keys next to its config, so copy the
      # read-only ConfigMap into the writable home first.
      command: ["sh", "-c", "mkdir -p $HOME/.config/wivrn && cp /etc/wivrn/config.json $HOME/.config/wivrn/ && exec sleep infinity"]
      env:
        - name: HOME
          value: /home/vr
        - name: XDG_RUNTIME_DIR
          value: /run/vr
        - name: XDG_CONFIG_HOME
          value: /home/vr/.config
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: all
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        claims:
          - name: gpu
      volumeMounts:
        - name: home
          mountPath: /home/vr
        - name: run
          mountPath: /run/vr
        - name: config
          mountPath: /etc/wivrn
          readOnly: true
        - name: nvidia-icd
          mountPath: /etc/vulkan/icd.d/nvidia_icd.json
          subPath: nvidia_icd.json
          readOnly: true
        - name: nvidia-icd
          mountPath: /usr/share/glvnd/egl_vendor.d/10_nvidia.json
          subPath: 10_nvidia.json
          readOnly: true
  volumes:
    - name: home
      emptyDir: {}
    - name: run
      emptyDir: {}
    - name: config
      configMap:
        name: wivrn-config
    - name: nvidia-icd
      configMap:
        name: nvidia-icd
