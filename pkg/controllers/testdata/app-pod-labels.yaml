# An App whose pod and volume claim templates carry their own labels and
# annotations, which the operator must copy onto the session pod and PVC
# alongside its own labels — which win when a template sets the same key.
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: firefox
spec:
  id: 3
  title: Firefox
  isHDRSupported: false
  appAssetWebP: ""
  template:
    metadata:
      labels:
        xerktech.com/gpu-claim: direwolf-gpu
        direwolf/user: spoof
      annotations:
        example.com/note: kept
    spec:
      containers:
        - name: app
          image: ghcr.io/games-on-whales/firefox:edge
  volumeClaimTemplate:
    metadata:
      labels:
        example.com/backup: daily
        direwolf/app: spoof
      annotations:
        example.com/note: pvc-kept
    spec:
      accessModes: ["ReadWriteOnce"]
