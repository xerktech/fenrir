{{- /*
moonlight-proxy's "Close Library" tile deletes the visitor's Library pod. Its
main Role names only the shared one (direwolf-library); this one names the
own-library Users' pods. Pod writes stay by name: the proxy is internet-facing
(charts/rbac_test.go).
*/}}
{{- if .Values.libraryUsers }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: moonlight-proxy-library-users
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames:
      {{- range .Values.libraryUsers }}
      - {{ printf "direwolf-library-%s" . | quote }}
      {{- end }}
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: moonlight-proxy-library-users
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: moonlight-proxy-library-users
subjects:
  - kind: ServiceAccount
    name: moonlight-proxy
    namespace: {{ .Release.Namespace }}
{{- end }}
