---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-4.4.0/charts/library/common/values.schema.json

global:
  fullnameOverride: direwolf

serviceAccount:
  direwolf_operator:
    forceRename: &operatorName direwolf-operator
  moonlight_proxy:
    forceRename: &proxyName moonlight-proxy

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 100
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch

controllers:
  direwolf_operator:
    forceRename: *operatorName
    serviceAccount:
      identifier: &operatorId direwolf_operator
    pod:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - "{{ .Release.Name }}"
                topologyKey: kubernetes.io/hostname
    containers:
      operator:
        args:
          # Session pods use hostNetwork on this node and share its IP with
          # moonlight-proxy; keep in sync with moonlight_proxy's nodeSelector.
          - --session-node-selector=kubernetes.io/hostname=talos04.xerktech.com
          # talos04 is a GPU node; keep in sync with moonlight_proxy's tolerations.
          - --session-tolerations=nvidia.com/gpu=present:NoSchedule
          - --session-port-range=20000-20999
          # The Library (on-demand Steam + Heroic desktop) is off unless
          # --library-port is set; enabling it needs, with service.library:
          #   --library-port=8080
          #   --library-trusted-proxies=<authenticating proxy's pod CIDR>
          #   --library-proxy-secret-file=<file; the proxy sends it in X-Direwolf-Proxy-Secret>
          #   --library-home-pvc=<shared Steam home PVC>
          #   --library-games-pvc=<shared game library PVC>
          # The catalogue (one App per installed game, read from the Library)
          # is off unless a base App is named; each is copied per game and its
          # pod template must run $DIREWOLF_LAUNCH_COMMAND:
          #   --catalogue-steam-app=<base App for Steam games>
          #   --catalogue-heroic-app=<base App for Epic/GOG games>
          # RomM ROMs (one App per playable ROM, a RetroArch session) are off
          # unless --romm-url is set; the base App is examples/retroarch.yaml,
          # and the token (a RomM client API token with roms.read) is
          # ROMM_TOKEN, from Secret direwolf-romm key token:
          #   --romm-url=http://romm.<namespace>.svc:8080
          #   --romm-app=retroarch
          #   --romm-collection-id=<only this RomM collection's ROMs>
        image:
          repository: ghcr.io/games-on-whales/fenrir/direwolf-operator
          tag: main
          pullPolicy: Always
        env:
          POD_NAME:
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          POD_NAMESPACE: "{{ .Release.Namespace }}"
          # Wolf built from the xerktech/wolf fork (XERK-1944), which carries the
          # waylanddisplaysrc fix (XERK-1740) and lists each stream's state, which
          # wolf-agent's catch-up reads (XERK-1947), and stops closing a stray fd on
          # every runner start, which wedged launch and RTSP (XERK-1929), and keeps
          # config.toml intact under concurrent API writes (XERK-1962), and a frozen
          # stream's stop no longer hangs every launch and RTSP (XERK-1966), and failed
          # OpenSSL calls stop pairing/control instead of carrying on (XERK-2015), and a
          # stream added right after a stop under the same client no longer collides
          # with the stopped one, so every attach can use one paired client (XERK-1964),
          # and API replies over 64 KiB (e.g. a long app list) arrive intact (XERK-1959).
          # The API rejects zero or out-of-range display modes (XERK-2042, XERK-2047).
          # Session shutdown and concurrent runner exits no longer crash Wolf (XERK-2022,
          # XERK-2023), streams started after a lobby join show the lobby (XERK-2045),
          # and no-GPU hosts stream with an older config.toml (XERK-2043).
          # A quick API pause-then-start no longer loses its video and audio (XERK-2046).
          # Lobby creation rejects invalid screen modes (XERK-2048), and apps started by
          # Wolf's process runner no longer keep its ports bound after it dies (XERK-2049).
          # GStreamer no longer tries and blacklists Wolf's C library as a plugin (XERK-1867).
          # A flood of RTSP ANNOUNCEs at a stream no longer crashes Wolf (XERK-2096).
          # RTSP only serves a stream to its own client's IP, so knowing the pod IP no longer
          # lets anyone take a stream's video or block its start (XERK-2115).
          # WOLF_HTTP_SERVERS=FALSE turns off Wolf's Moonlight HTTP/HTTPS and mDNS,
          # which session pods rely on (XERK-1946): never pin an older image.
          # Moonlight clients that support it get encrypted RTSP (rtspenc://), so others behind
          # the client's IP or on the path can't take the stream's setup (XERK-2118).
          # A stream's producer shutting down while viewers join, leave or switch no longer
          # crashes Wolf (patched gst-interpipe, XERK-2114).
          # The API's get-icon serves only real image files, never arbitrary host files such as
          # keys or /etc/shadow (XERK-2097); a stream ended before it starts no longer leaks its
          # pipelines (XERK-2111).
          # Pinned by hand; CI does not set it.
          WOLF_IMAGE: ghcr.io/xerktech/wolf:xerktech-49541c1@sha256:99b54dd87f8eb3499bb82d5c2f778407ca699f44ffcea716e7984cb9320bf5fe
          AGENT_IMAGE: ghcr.io/games-on-whales/fenrir/wolf-agent:main
          LIBRARY_IMAGE: ghcr.io/games-on-whales/fenrir/library:main
          ROMM_TOKEN:
            valueFrom:
              secretKeyRef:
                name: direwolf-romm
                key: token
                optional: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
  moonlight_proxy:
    forceRename: *proxyName
    serviceAccount:
      identifier: &proxyId moonlight_proxy
    pod:
      # Moonlight streams from the host it paired with and only accepts a port
      # redirect, so the proxy must sit on the session pods' node IP.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: talos04.xerktech.com
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: present
          effect: NoSchedule
    containers:
      proxy:
        args:
          - --tls-cert=/etc/certs/tls.crt
          - --tls-key=/etc/certs/tls.key
          # One GPU: a second user's /launch gets Moonlight's busy error.
          - --max-concurrent-sessions=1
        image:
          repository: ghcr.io/games-on-whales/fenrir/moonlight-proxy
          tag: main
          pullPolicy: Always
        env:
          POD_NAME:
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          POD_NAMESPACE: "{{ .Release.Namespace }}"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
service:
  app:
    # Keeps the Service named "direwolf" (the cert's dnsNames) when
    # service.library is enabled too.
    forceRename: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    controller: moonlight_proxy
    # Clients reach the proxy on the node IP (hostNetwork), not through this.
    type: ClusterIP
    ports:
      http:
        protocol: TCP
        port: 47984
      https:
        protocol: TCP
        port: 47989
  # The Library page (operator --library-port). The Ingress points here, behind
  # Authentik; the operator adds the pod's own basic-auth password.
  library:
    enabled: false
    controller: direwolf_operator
    ports:
      http:
        protocol: TCP
        port: 8080
persistence:
  tls-cert:
    type: secret
    name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-tls'
    defaultMode: 0400
    advancedMounts:
      moonlight_proxy:
        proxy:
          - path: /etc/certs
            readOnly: true
rbac:
  roles:
    direwolf_operator:
      forceRename: *operatorName
      type: Role
      rules:
        - apiGroups: ["coordination.k8s.io"]
          resources: ["leases"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: ["direwolf.games-on-whales.github.io"]
          resources: ["*"]
          verbs: ["*"]
        - apiGroups: [""]
          resources: ["persistentvolumeclaims", "configmaps"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        # Per-session wolf-agent bearer token (create, replace if stale), and
        # the Library's basic-auth password.
        - apiGroups: [""]
          resources: ["secrets"]
          verbs: ["get", "create", "delete"]
        # One bare pod per Session (watched for exits; never recreated), and
        # the Library pod (patch: its last-activity annotation).
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch", "create", "delete", "patch"]
        # App.spec.gpu: one claim per Session, owned by it (garbage collected).
        - apiGroups: ["resource.k8s.io"]
          resources: ["resourceclaims"]
          verbs: ["get", "create"]
        # Library idle check (download dirs), catalogue scan and `steam -shutdown`. WebSocket
        # exec needs get as well as create.
        - apiGroups: [""]
          resources: ["pods/exec"]
          verbs: ["get", "create"]
        # Warning Events on an App whose Session ended over its spec
        # (patch: the recorder aggregates repeats into one Event).
        - apiGroups: [""]
          resources: ["events"]
          verbs: ["create", "patch"]
    moonlight_proxy:
      forceRename: *proxyName
      type: Role
      rules:
      - apiGroups: ["direwolf.games-on-whales.github.io"]
        resources: ["*"]
        verbs: ["get", "list", "watch"]
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list", "watch"]
      # The "Close Library" tile deletes the Library pod, and only it: the
      # proxy is internet-facing, so no patch (a pod's image is mutable).
      - apiGroups: [""]
        resources: ["pods"]
        resourceNames: ["direwolf-library"]
        verbs: ["delete"]
      - apiGroups: ["direwolf.games-on-whales.github.io"]
        resources: ["pairings", "sessions"]
        verbs: ["create", "delete", "patch", "update", "get", "list", "watch"]
  bindings:
    direwolf_operator:
      forceRename: *operatorName
      type: RoleBinding
      roleRef:
        identifier: *operatorId
      subjects:
        - identifier: *operatorId
    moonlight_proxy:
      forceRename: *proxyName
      type: RoleBinding
      roleRef:
        identifier: *proxyId
      subjects:
        - identifier: *proxyId
rawResources:
  # Only the operator, which sits behind the authenticating Ingress, may reach
  # the Library desktop. Defence in depth: the pod also demands a password only
  # the operator knows, as not every CNI enforces NetworkPolicy.
  library-ingress:
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    spec:
      spec:
        podSelector:
          matchLabels:
            direwolf/library: "true"
        policyTypes: ["Ingress"]
        ingress:
          - from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/controller: direwolf_operator
  # Create a selfsigned Issuer, in order to create a root CA certificate for signing certificates
  self-signed-issuer:
    apiVersion: cert-manager.io/v1
    kind: Issuer
    spec:
      spec:
        selfSigned: {}
  # Generate a CA Certificate used to sign certificates
  ca-cert:
    apiVersion: cert-manager.io/v1
    kind: Certificate
    spec:
      spec:
        secretName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-ca'
        duration: 43800h # 5y
        issuerRef:
          name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-self-signed-issuer'
          kind: Issuer
        commonName: 'ca.{{ include "bjw-s.common.lib.chart.names.fullname" $ }}.cert-manager'
        isCA: true
  # Create an Issuer that uses the above generated CA certificate to issue certs
  ca-issuer:
    apiVersion: cert-manager.io/v1
    kind: Issuer
    spec:
      spec:
        ca:
          secretName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-ca'
# Finally, generate a serving certificate for the direwolf to use
  cert:
    apiVersion: cert-manager.io/v1
    kind: Certificate
    spec:
      spec:
        secretName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-tls'
        duration: 8760h # 1y
        issuerRef:
          name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-ca-issuer'
          kind: Issuer
        dnsNames:
        - '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
        - '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}.{{ .Release.Namespace }}'
        - '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}.{{ .Release.Namespace }}.svc'
