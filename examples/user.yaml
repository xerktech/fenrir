---
# yaml-language-server: $schema=https://github.com/games-on-whaless/fenrir/raw/refs/heads/main/schemas/direwolf.games-on-whales.github.io/user_v1alpha1.json
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: User
metadata:
  name: alex
  namespace: direwolf
# No host /dev/input or /run/udev for Wolf: it builds its pads on /dev/uinput,
# which cmd/nri-input grants it, and wolf-agent shares each pad with the game.
# A hostPath /dev/input would hand Wolf every host input device.
# No GPU resource here either: the GPU comes from the App's DRA claim
# (App.spec.gpu, or a claim like examples/nvidia_devices/gpu-claim.yaml).
spec: {}
