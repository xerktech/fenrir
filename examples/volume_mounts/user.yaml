---
# yaml-language-server: $schema=https://github.com/games-on-whales/fenrir/raw/refs/heads/main/schemas/direwolf.games-on-whales.github.io/user_v1alpha1.json
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: User
metadata:
  name: alex
  namespace: direwolf
spec:
  resources:
    limits:
      cpu: 4000m
      memory: 8G
    requests:
      cpu: 4000m
      memory: 8G
  volumes:
    - name: host-dri
      hostPath:
        path: /dev/dri/renderD129
        type: CharDevice

  sidecarPolicies:
    # We are overriding the default resources for some sidecars for this user.
    wolf:
      resources:
        requests:
          cpu: 1000m
          memory: 2G
        limits:
          cpu: 1000m
          memory: 2G
      # No /dev/input or /dev/uinput: cmd/nri-input grants Wolf /dev/uinput,
      # and a hostPath /dev/input would hand it every host input device.
      volumeMounts:
       - name: host-dri
         mountPath: /dev/dri/renderD128
         readOnly: false
    # pulseaudio: