---
# yaml-language-server: $schema=https://github.com/games-on-whaless/fenrir/raw/refs/heads/main/schemas/direwolf.games-on-whales.github.io/app_v1alpha1.json
#
# Assetto Corsa in VR (epic XERK-2656, XERK-2665; .claude/rules/vr.md). Launched
# from Moonlight like any App: the Moonlight stream is a flat mirror of the game
# on Wolf's lobby display, while a Quest running the WiVRn app connects to the VR
# server in the App pod directly, by the node's IP and this Session's VR port.
#
# Connecting a headset (mDNS is off, so the headset can't find the server): a
# bar across the top of the Moonlight mirror reads "VR headset: connect the WiVRn
# app to <node IP> port <port>". Only the User's Headsets connect; they pair
# through the VR front door (XERK-2808), never by PIN in a session (XERK-2811),
# and a User with none gets no session.
#
# Seated height: WiVRn's seated origin is a fixed 1.6 m up (XERK-2689). Once the
# car is on track (AC ignores input in the pit), press Ctrl+Space on the
# Moonlight keyboard: AC recenters the seat at the headset's height.
#
# Deployed copy: xerktech/ArgoCD games/direwolf/app-*.yaml, image pinned by
# digest (XERK-2666). It needs, all as the steam App has them:
#   - the operator's --app-pod-host-dir (requireAppPod) and --vr-port-range
#     (vrPort, XERK-2664);
#   - the nvidia-icd and home-owner ConfigMaps and the steam-home-local PVC
#     (ArgoCD games/direwolf);
#   - a User whose resources ceiling allows 24Gi of memory (16Gi was
#     OOM-killed at Steam + AC start; XERK-2660).
# One VR Session per GPU: a VR stream used ~50% of an RTX 3090's NVENC.
#
# Assetto Corsa itself, in the shared Steam install:
#   - installed in Steam's default library in the shared home, where every
#     Steam game goes (the per-User config link below sits in its Proton
#     prefix there), with Proton 9.0 installed and AC pinned to it (Steam >
#     Properties > Compatibility; the image warns if it isn't);
#   - flat sessions on the steam image (it links them to the flat config):
#     after the first VR launch, flat AC from any other image (the Library)
#     finds no Documents folder.
# The image's ac-setup does the rest before Steam starts, on every launch
# (XERK-2726; a set-up install costs about a second): the Proton prefix,
# winetricks corefonts and d3dcompiler_47 and a segoeui*.ttf substitute in it,
# AssettoCorsa.exe replaced by a copy of acs.exe (Content Manager can't run
# under Proton and the Kunos launcher has no VR mode; redone when a Steam
# update or verify puts the launcher back), CSP at DIREWOLF_AC_CSP (CSP 0.2.11
# crashes in VR), and the flat config's fullscreen and pad input, once. The
# first launch takes a few minutes longer (downloads), with the mirror black.
# Steam's first launch may ask for AC's EULA and run "Processing Vulkan
# shaders" (10+ minutes, skippable): answer both on the Moonlight mirror.
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: assetto-corsa-vr
  namespace: direwolf
spec:
  id: 20
  title: Assetto Corsa VR
  # A plain 600x800 cover drawn for this example (headset and title).
  appAssetWebP: 
  isHDRSupported: false
  # WiVRn and Steam need the user-namespaced App pod, off the host network
  # (XERK-1920, XERK-2692), and vrPort's hostPort lives there.
  requireAppPod: true
  # One port per Session from --vr-port-range, as DIREWOLF_VR_PORT: WiVRn's TCP
  # and UDP, a hostPort on the node (XERK-2664).
  vrPort: true
  # The game renders, WiVRn encodes both eyes (NVENC) and Wolf encodes the
  # mirror, all on this one card. The spike ran AC + WiVRn in 12Gi.
  gpu:
    memory: 12Gi
    deviceClassName: gpu.nvidia.com
  # The per-User (and App) PVC that stateMounts live on.
  volumeClaimTemplate:
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
  # Kept per User, never in the shared Steam home. The operator mounts each at
  # /srv/direwolf/state/<name>, never in a volume a game writes: the runtime
  # follows a link at a mount point, so a game's link could put it over /etc
  # (XERK-2713). The shared places link there instead, and each container
  # resolves the link to its own User's mount.
  #   - wivrn: WiVRn's config and paired headsets' keys; openxr, openvr: the
  #     active runtime and openvrpaths.vrpath WiVRn writes while it runs. The
  #     image links ~/.config/<name> to them (in a flat session the links lead
  #     nowhere, so no Proton game finds a VR runtime) and refuses to start
  #     unless each is a mount.
  #   - ac-documents: AC's Documents/Assetto Corsa (cfg/video.ini in VR mode,
  #     CSP's config in cfg/extension, setups). The command below turns that
  #     folder in the shared prefix into a link to /srv/direwolf/ac-documents,
  #     keeping the flat copy as "Assetto Corsa.flat": the vr image links that
  #     path here, the steam image to the flat copy. Seeded from it once.
  stateMounts:
  - name: wivrn
  - name: openxr
  - name: openvr
  - name: ac-documents
  template:
    spec:
      volumes:
      # The Steam home every Steam App shares, AC's install with it (ArgoCD
      # pvc.yaml). No games volume: nothing here is in /games.
      - name: steam-home
        persistentVolumeClaim:
          claimName: steam-home-local
      # NVIDIA's Vulkan ICD and EGL vendor manifests: the GPU claim injects the
      # libraries only, and without them WiVRn composites on lavapipe and NVENC
      # fails with CUDA error 999 (XERK-2660).
      - name: nvidia-icd
        configMap:
          name: nvidia-icd
      # Hands root-created home entries back to PUID (ArgoCD).
      - name: home-owner
        configMap:
          name: home-owner
      # Steam's Chromium UI fills the 64 MiB default /dev/shm.
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
      containers:
      - name: app
        # images/gow-nvidia32 target vr: the steam image plus WiVRn, xrizer and
        # OpenComposite. Pin by digest where deployed.
        image: ghcr.io/xerktech/fenrir/vr:main
        resources:
          requests:
            cpu: "8"
            memory: 24Gi
          limits:
            cpu: "8"
            memory: 24Gi
        # As the steam App: Proton's bwrap in the user-namespaced App pod. No
        # SYS_ADMIN, NET_ADMIN, hostPath or privilege; WiVRn needs none.
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: true
          procMount: Unmasked
          capabilities:
            add: ["SYS_NICE", "SYS_PTRACE", "NET_RAW"]
          seccompProfile:
            type: Unconfined
          appArmorProfile:
            type: Unconfined
        env:
        - name: RUN_SWAY
          value: "true"
        - name: GBM_BACKENDS_PATH
          value: /usr/lib/gbm:/usr/lib/x86_64-linux-gnu/gbm
        # OpenComposite: AC's recenter (Ctrl+Space) was verified on it, and it
        # looked better than xrizer in the spike.
        - name: DIREWOLF_VR_OPENVR
          value: opencomposite
        # CSP's dwrite.dll (Steam passes it to Proton with GoW's own).
        - name: DIREWOLF_WINEDLLOVERRIDES
          value: dwrite=n,b
        # The CSP version ac-setup installs, one the image pins by sha256
        # (images/gow-nvidia32/vr/ac-csp-versions.json). Changing it reinstalls
        # only CSP; empty leaves the installed CSP alone.
        - name: DIREWOLF_AC_CSP
          value: "0.3.1"
        # The address the headset dials, shown on the mirror: the node's, as the
        # VR port is a hostPort there.
        - name: DIREWOLF_VR_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        volumeMounts:
        - name: steam-home
          mountPath: /home/retro
        # The shared prefix's flat AC Documents, read-only, for seeding the
        # per-User copy.
        - name: steam-home
          mountPath: /run/direwolf-vr/home
          readOnly: true
        - name: nvidia-icd
          mountPath: /usr/share/glvnd/egl_vendor.d/10_nvidia.json
          subPath: 10_nvidia.json
          readOnly: true
        - name: nvidia-icd
          mountPath: /etc/vulkan/icd.d/nvidia_icd.json
          subPath: nvidia_icd.json
          readOnly: true
        - name: home-owner
          mountPath: /etc/cont-init.d/zz-home-owner.sh
          subPath: zz-home-owner.sh
          readOnly: true
        - name: dshm
          mountPath: /dev/shm
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          trap "exit 0" SIGINT SIGTERM
          # Game containers wait for Wolf's display, or the stream never starts.
          # A native VR Session (DIREWOLF_VR_MODE=native) has no Wolf: the
          # image starts its own headless sway.
          if [ "${DIREWOLF_VR_MODE:-}" != native ]; then
            while [ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; do echo "Waiting for wayland display..." >&2; sleep 1; done
          fi

          # Steam's default library, in the shared home (the steam image's
          # flat link names the same path).
          apps=/home/retro/.steam/debian-installation/steamapps
          docs=$apps/compatdata/244210/pfx/drive_c/users/steamuser/Documents/Assetto\ Corsa
          state=/srv/direwolf/state
          if [ ! -f "$apps/appmanifest_244210.acf" ]; then
            echo "assetto-corsa-vr: Assetto Corsa is not installed in Steam's library in the home ($apps); install it there" >&2
            exit 1
          fi
          # The operator mounts the stateMounts under $state, outside every
          # volume (XERK-2713). Each must be a mount exactly where named, or
          # the session ends before the entrypoint runs.
          for d in "$state/wivrn" "$state/openxr" "$state/openvr" "$state/ac-documents"; do
            if [ "$(realpath -e -- "$d")" != "$d" ] || ! mountpoint -q -- "$d"; then
              echo "assetto-corsa-vr: $d is not this User's mount (spec.stateMounts); refusing to start" >&2
              exit 1
            fi
            # Created root-owned; Steam and Wine run as PUID. Only the mount
            # point: everything below it is the User's own.
            chown -h "$PUID:$PGID" -- "$d"
          done
          # As PUID: the prefix, the acs.exe swap, CSP and the flat config,
          # each skipped once done (images/gow-nvidia32/vr/ac-setup).
          gosu "$PUID:$PGID" /opt/direwolf/vr/ac-setup
          # As PUID: AC's Documents folder in the shared prefix becomes a link
          # to /srv/direwolf/ac-documents, which the vr image links to this
          # User's mount and the steam image to the flat copy, moved beside
          # it. Only in the shared prefix, never through it: a link is
          # replaced, not followed.
          gosu "$PUID:$PGID" python3 -I - "$docs" /srv/direwolf/ac-documents <<'LINK'
          import os, sys
          docs, target = sys.argv[1], sys.argv[2]
          flat = docs + ".flat"
          if not os.path.isdir(os.path.dirname(docs)):
              sys.exit(f"assetto-corsa-vr: no {os.path.dirname(docs)} in Assetto Corsa's prefix")
          if os.path.islink(docs):
              if os.readlink(docs) == target:
                  sys.exit(0)
          elif os.path.isdir(docs):
              if os.path.lexists(flat):
                  sys.exit(f"assetto-corsa-vr: both {docs} and {flat} exist; move one aside")
              os.rename(docs, flat)
          elif os.path.lexists(docs):
              sys.exit(f"assetto-corsa-vr: {docs} is neither a folder nor a link; move it aside")
          if not os.path.lexists(flat):
              os.mkdir(flat)
          tmp = docs + ".direwolf-link"
          try:
              os.unlink(tmp)
          except FileNotFoundError:
              pass
          os.symlink(target, tmp)
          os.replace(tmp, docs)
          LINK
          # As PUID: seed cfg/ from the shared prefix once, then force VR mode.
          # Lines of video.ini are kept; only the two keys are set.
          gosu "$PUID:$PGID" python3 -I - "/run/direwolf-vr/home/${docs#/home/retro/}.flat/cfg" "$state/ac-documents/cfg" <<'PY'
          import os, shutil, sys
          shared, cfg = sys.argv[1], sys.argv[2]
          if not os.path.lexists(cfg):
              if os.path.isdir(shared) and not os.path.islink(shared):
                  # Links stay behind: in the shared prefix they point into
                  # space every game can write.
                  shutil.copytree(shared, cfg, ignore=lambda d, names: [n for n in names if os.path.islink(os.path.join(d, n))])
              else:
                  os.mkdir(cfg)
          path = os.path.join(cfg, "video.ini")
          want = {"VIDEO": {"FULLSCREEN": "0"}, "CAMERA": {"MODE": "OPENVR"}}
          # A link is replaced, not followed. Bytes that aren't UTF-8 are kept
          # as they were; a BOM is dropped (AC writes plain ASCII).
          lines = []
          if os.path.isfile(path) and not os.path.islink(path):
              with open(path, newline="", encoding="utf-8-sig", errors="surrogateescape") as f:
                  lines = f.read().splitlines()
          out, section, done = [], None, set()
          def finish(sec):
              for k, v in want.get(sec, {}).items():
                  if (sec, k) not in done:
                      out.append(f"{k}={v}")
                      done.add((sec, k))
          for line in lines:
              s = line.strip()
              if s.startswith("[") and s.endswith("]"):
                  finish(section)
                  section = s[1:-1].strip().upper()
              elif "=" in s and section in want:
                  k = s.split("=", 1)[0].strip().upper()
                  if k in want[section]:
                      if (section, k) in done:
                          continue
                      line = f"{k}={want[section][k]}"
                      done.add((section, k))
              out.append(line)
          finish(section)
          for sec in want:
              if any((sec, k) not in done for k in want[sec]):
                  out.append(f"[{sec}]")
                  finish(sec)
          tmp = path + ".direwolf-tmp"
          try:
              os.unlink(tmp)
          except FileNotFoundError:
              pass
          with open(tmp, "x", newline="", encoding="utf-8", errors="surrogateescape") as f:
              f.write("\r\n".join(out) + "\r\n")
          os.replace(tmp, path)
          PY

          # GoW's Steam startup runs `steam ${STEAM_STARTUP_FLAGS}`: Big Picture
          # with AC launched (AssettoCorsa.exe is acs.exe, see above).
          export STEAM_STARTUP_FLAGS="-bigpicture -applaunch 244210"
          exec /entrypoint.sh
