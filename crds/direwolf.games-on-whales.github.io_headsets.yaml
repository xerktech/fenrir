---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: headsets.direwolf.games-on-whales.github.io
spec:
  group: direwolf.games-on-whales.github.io
  names:
    kind: Headset
    listKind: HeadsetList
    plural: headsets
    singular: headset
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Headset is a VR headset paired with a User (XERK-2669): the public key the
          VR server (WiVRn) lets connect to that User's VR Sessions. The operator
          writes a User's Headsets into WiVRn's known keys at every VR session start,
          so these objects, not the keys file on the User's volume, decide which
          headsets connect. Deleting one revokes the headset and ends the User's VR
          Sessions, as deleting a Pairing does for a Moonlight client.

          The spec is immutable: a changed key would let a different headset in
          without ending the Sessions the old one may hold.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              displayName:
                description: |-
                  DisplayName is the name WiVRn shows for the key (the headset's model
                  at pairing).
                maxLength: 128
                type: string
              publicKey:
                description: |-
                  PublicKey is the headset's long-term public key as WiVRn stores it in
                  known_keys.json: a PEM "PUBLIC KEY" block.
                maxLength: 1024
                pattern: ^-----BEGIN PUBLIC KEY-----\n[A-Za-z0-9+/=\n]+-----END PUBLIC
                  KEY-----\n?$
                type: string
              userReference:
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
            required:
            - publicKey
            - userReference
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: spec is immutable; delete the Headset to revoke it
          rule: self.spec == oldSelf.spec
    served: true
    storage: true
